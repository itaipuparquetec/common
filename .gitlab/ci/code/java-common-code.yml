java-common-lint:
  stage: lint
  image: maven:3.9.9-eclipse-temurin-21
  tags: [ common ]
  script:
    - mvn compile checkstyle:check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [ ./**/* ]
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes: [ ./**/* ]
    - when: never

java-common-tests:
  stage: tests
  image: maven:3.9.9-eclipse-temurin-21
  tags:
    - common
  needs:
    - job: java-common-lint
      artifacts: false
  script:
    - mvn clean verify
    - mvn javadoc:javadoc
    - cat target/site/jacoco/index.html | grep -o 'Total[^%]*%' | sed 's/Total/Total Coverage:/'
  coverage: '/\d+\%/'
  artifacts:
    when: always
    expire_in: 3 days
    paths:
      - target/
      - target/*.jar
      - target/site/javadoc/
    reports:
      junit:
        - target/surefire-reports/*.xml
      coverage_report:
        coverage_format: cobertura
        path: target/site/jacoco/jacoco.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

java-common-quality-gate:
  stage: quality-gate
  image: maven:3.9.9-eclipse-temurin-21
  tags:
    - common
  variables:
    GIT_DEPTH: "0"
  needs:
    - job: tests
      artifacts: true
  script:
    - mvn sonar:sonar -Dsonar.qualitygate.wait=true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

java-common-deploy:
  stage: deploy
  image: maven:3.9.9-eclipse-temurin-21
  tags:
    - common
  needs:
    - job: quality-gate
      artifacts: true
  before_script:
    - mkdir -p ~/.m2
    - |
      cat <<EOF > ~/.m2/settings.xml
      <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
          xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
          xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                              https://maven.apache.org/xsd/settings-1.0.0.xsd">
        <servers>
          <server>
            <id>maven-snapshots</id>
            <username>${MAVEN_REPO_USER}</username>
            <password>${MAVEN_REPO_PASSWORD}</password>
          </server>
          <server>
            <id>maven-releases</id>
            <username>${MAVEN_REPO_USER}</username>
            <password>${MAVEN_REPO_PASSWORD}</password>
          </server>
        </servers>
      </settings>
      EOF
  script:
    - mvn deploy -DskipTests
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
