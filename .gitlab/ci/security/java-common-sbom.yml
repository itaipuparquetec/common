common-sbom:
  stage: security
  retry: 2
  image: alpine:latest
  tags: [ common ]
  before_script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - syft scan dir:/ -o cyclonedx-json=sbom-java-common.json
  artifacts:
    when: on_success
    expire_in: 1 month
    paths:
      - sbom-java-common.json
    reports:
      cyclonedx:
        - sbom-java-common.json
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - when: never