java-common-secret-detection:
  stage: security
  retry: 2
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [ "" ]
  tags: [ common ]
  script:
    - gitleaks detect --source . --exit-code 1 --redact --config .gitlab/ci/security/.gitleaks.toml --baseline-path .gitlab/ci/security/.gitleaks-baseline.json --report-format json --report-path gitleaks-report.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gitleaks-report.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - when: never
